name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The workspace runs its TypeScript sources directly, which needs Node 22.18 or newer.
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run app:typecheck
      - run: npm run app:test
      - run: npm run pkg:build

      - name: Check the package contents
        run: npm pack --dry-run
